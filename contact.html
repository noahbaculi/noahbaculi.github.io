<!doctype html>
<html>
  <head>
    <title>Noah - Contact</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <meta
      name="description"
      content="Noah's Contact Information | Contact Form • Affiliations • Social Links"
    />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="icon" href="/images/icons/favicon_50_w.webp" />
  </head>

  <body class="is-preload">
    <div id="wrapper">
      <div id="headers"></div>

      <div id="main">
        <div class="inner">
          <br />
          <br />
          <h2 style="margin: 0">Send Me A Message!</h2>
          <br />
          <form
            name="contact"
            method="post"
            data-netlify-recaptcha="true"
            data-netlify="true"
          >
            <table>
              <tr>
                <td>
                  <label for="name">Name *</label>
                </td>
                <td>
                  <input
                    type="text"
                    name="name"
                    maxlength="50"
                    placeholder="Name"
                    required
                  />
                </td>
              </tr>
              <tr>
                <td>
                  <label for="email">Email Address *</label>
                </td>
                <td>
                  <input
                    type="email"
                    name="email"
                    maxlength="100"
                    size="30"
                    placeholder="Email"
                    required
                  />
                </td>
              </tr>
              <tr>
                <td>
                  <label for="category">Category</label>
                </td>
                <td>
                  <div class="check-row">
                    <input
                      type="checkbox"
                      id="resume_request"
                      name="resume_request"
                    />
                    <label for="resume_request">Resume Request</label>
                  </div>
                  <div class="check-row">
                    <input
                      type="checkbox"
                      id="career_coaching"
                      name="career_coaching"
                    />
                    <label for="career_coaching">Career Coaching</label>
                  </div>
                  <div class="check-row">
                    <input
                      type="checkbox"
                      id="rust_coaching"
                      name="rust_coaching"
                    />
                    <label for="rust_coaching">Rust Coaching</label>
                  </div>
                  <div class="check-row">
                    <input
                      type="checkbox"
                      id="personal_inquiry"
                      name="personal_inquiry"
                    />
                    <label for="personal_inquiry">Personal Inquiry</label>
                  </div>
                  <div class="check-row">
                    <input
                      type="checkbox"
                      id="asme_inquiry"
                      name="asme_inquiry"
                    />
                    <label for="asme_inquiry">ASME Inquiry</label>
                  </div>
                </td>
              </tr>
              <tr>
                <td>
                  <label for="message">Message *</label>
                </td>
                <td>
                  <textarea
                    name="message"
                    maxlength="1000"
                    cols="25"
                    rows="6"
                    placeholder="Comment or Message"
                    required
                  ></textarea>
                </td>
              </tr>
            </table>
            <div data-netlify-recaptcha="true"></div>
            <div class="align-center">
              <input type="submit" value="Submit" />
            </div>
            <br />
          </form>
        </div>
      </div>
      <footer id="footer"></footer>
    </div>
    <script src="/assets/js/jquery.min.js"></script>
    <script src="/assets/js/browser.min.js"></script>
    <script src="/assets/js/breakpoints.min.js"></script>
    <script src="/assets/js/util.js"></script>
    <script src="/assets/js/main.js"></script>
  </body>
</html>
