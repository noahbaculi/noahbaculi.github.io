<!doctype html>
<html lang="en" hidden>
  <head>
    <title>Noah - Guitar Tab Generator</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Noah's Guitar Tab Generator | Input pitches to calculate optimal fingerstyle compositions | Open source Rust + TypeScript"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap"
    />
    <script src="/assets/js/theme-init.js"></script>
    <script>
      document.documentElement.classList.toggle(
        "dark",
        document.documentElement.getAttribute("data-theme") === "dark",
      );
    </script>
    <link rel="stylesheet" href="/assets/css/guitartab.css" />
    <link rel="icon" href="/images/icons/favicon-50_w.webp" />
    <script type="twind-config">
      { "darkMode": "class" }
    </script>
    <script type="module" src="https://cdn.skypack.dev/twind/shim"></script>
  </head>
  <body>
    <div class="workbench">
      <section class="header-grid gtg-header">
        <div class="exit">
          <nav class="flex" aria-label="Breadcrumb">
            <ol class="inline-flex items-center space-x-1 mb-5 md:mb-0">
              <li class="inline-flex items-center">
                <a
                  href="/index.html"
                  class="inline-flex items-center text-sm font-medium text-gray-700 hover:text-blue-600 dark:text-gray-400 dark:hover:text-white"
                >
                  <svg aria-hidden="true" class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path>
                  </svg>
                  Home
                </a>
              </li>
              <li>
                <div class="flex items-center">
                  <svg aria-hidden="true" class="w-6 h-6 text-gray-400" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path>
                  </svg>
                  <a href="/projects/index.html" class="ml-1 text-sm font-medium text-gray-700 hover:text-blue-600 md:ml-1 dark:text-gray-400 dark:hover:text-white">Projects</a>
                </div>
              </li>
            </ol>
          </nav>
        </div>
        <div class="header">
          <h1 class="text-2xl">Guitar Tab Generator</h1>
        </div>
      </section>

      <section class="gtg-main">
        <!-- Input column -->
        <section class="input-col">
          <div class="example-row">
            <select id="exampleSongs" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
              <option value="examples" selected>ᐁ Load an example</option>
              <option value="Fur Elise">Fur Elise</option>
              <option value="Greensleeves">Greensleeves</option>
              <option value="Silent Night">Silent Night</option>
              <option value="Twinkle Twinkle">Twinkle Twinkle</option>
              <option value="Hey Jude">Hey Jude</option>
            </select>
            <button type="button" id="clearInputButton" class="clear-btn">Clear</button>
          </div>

          <textarea
            id="pitchInput"
            name="pitchInput"
            rows="9"
            aria-label="Pitch input"
            placeholder="Type pitches, one per line. E4 = note, A2A3 = chord, blank line = rest, --- = measure break"
          ></textarea>

          <div class="syntax-legend" id="syntaxLegend">
            <p class="syntax-legend__title">Syntax</p>
            <div class="syntax-row"><code class="syntax-key">E4</code><span class="syntax-desc">a single note</span></div>
            <div class="syntax-row"><code class="syntax-key">A2A3</code><span class="syntax-desc">stacked notes are a chord</span></div>
            <div class="syntax-row"><code class="syntax-key">(blank line)</code><span class="syntax-desc">a rest</span></div>
            <div class="syntax-row"><code class="syntax-key">---</code><span class="syntax-desc">a measure break</span></div>
          </div>

          <div class="controls-grid">
            <label for="guitarTuning">Guitar Tuning
              <select id="guitarTuning" name="guitarTuning" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                <option value="standard" selected>Standard</option>
                <option value="dsus4">DADGAD</option>
                <option value="c6">C6</option>
                <option value="openC">Open C</option>
                <option value="openD">Open D</option>
                <option value="openE">Open E</option>
                <option value="openG">Open G</option>
                <option value="dropB">Drop B</option>
                <option value="dropC">Drop C</option>
                <option value="dropD">Drop D</option>
              </select>
            </label>
            <label for="guitarCapo">Guitar Capo
              <select id="guitarCapo" name="guitarCapo" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                <option value="0" selected>None</option>
                <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                <option value="10">10</option><option value="11">11</option>
              </select>
            </label>
            <label for="maxFretSpan">Max Fret Span
              <select id="maxFretSpan" name="maxFretSpan" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                <option value="" selected>Any</option>
                <option value="2">2</option><option value="3">3</option><option value="4">4</option>
                <option value="5">5</option><option value="6">6</option>
              </select>
            </label>
            <label for="tabPadding">Spacing
              <select id="tabPadding" name="tabPadding" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                <option value="0">0</option>
                <option value="1" selected>1</option>
                <option value="2">2</option><option value="3">3</option><option value="4">4</option>
              </select>
            </label>
            <label for="tabLineLength" id="tabLineLengthLabel" style="grid-column: 1 / -1"></label>
            <input type="range" min="30" max="150" value="60" id="tabLineLength" style="grid-column: 1 / -1" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer dark:bg-gray-700" />
          </div>
        </section>

        <!-- Output column -->
        <section class="output-col">
          <div class="example-row" style="justify-content: flex-end">
            <button type="button" id="copyButton" class="io-btn" disabled>Copy</button>
            <button type="button" id="exportButton" class="io-btn" disabled>Download</button>
          </div>

          <div id="arrangementSelector" class="arrangement-selector"></div>

          <pre id="tabOutput" class="is-message" aria-label="Generated tab" tabindex="0">Enter pitches on the left to generate a tab.</pre>

          <div id="transportBar" class="transport" hidden>
            <button type="button" id="resetPlaybackButton" class="transport__btn" aria-label="Reset playback" disabled>
              <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 5V1L7 6l5 5V7a5 5 0 11-5 5H5a7 7 0 107-7z"/></svg>
            </button>
            <button type="button" id="playButton" class="transport__btn transport__btn--primary" aria-label="Play">
              <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button type="button" id="pauseButton" class="transport__btn transport__btn--primary" aria-label="Pause" style="display: none">
              <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
            </button>
            <div class="progress-track"><div id="playbackProgress" class="progress-fill"></div></div>
            <label class="tempo">Tempo
              <input type="range" id="tempoControl" min="40" max="240" value="120" />
              <span id="tempoValue">120</span>
            </label>
          </div>
        </section>
      </section>
    </div>

    <script src="/assets/js/main.js"></script>
    <script>
      var exports = {}; // instantiate exports variable to pull guitar exports
    </script>
    <script type="module" src="https://unpkg.com/tone"></script>
    <script type="module" src="/assets/js/guitartab.js"></script>
  </body>
</html>
