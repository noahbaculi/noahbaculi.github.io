<!doctype html>
<html>
  <head>
    <title>Noah - Portfolio</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1,
			user-scalable=no"
    />
    <meta name="description" content="Noah's | Independent Projects" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="icon" href="/images/icons/favicon-50_w.webp" />
  </head>

  <body class="is-preload">
    <div id="headers"></div>
    <div id="navbar" class="desktop_only"></div>
    <div id="subnavbar" class="desktop_only"></div>
    <div id="wrapper">
      <div id="main">
        <div class="inner">
          <h2 class="align-center">Independent Projects</h2>
          <div class="tiles_row">
            <placeholder id="top_projects"></placeholder>
            <div class="project_tile">
              <a href="/professional/aldras.html">
                <img
                  srcset="
                    /images/professional/aldras/aldras-400_w.webp   400w,
                    /images/professional/aldras/aldras-800_w.webp   800w,
                    /images/professional/aldras/aldras-1600_w.webp 1600w,
                    /images/professional/aldras/aldras-2000_w.webp 2000w
                  "
                  sizes="100vw"
                  loading="lazy"
                  decoding="async"
                  src="/images/professional/aldras/aldras-2000_w.webp"
                  alt="Aldras"
                />
              </a>
              <div>
                <div class="project_tile_tech_used">
                  <div>
                    <img src="/images/logos/python.svg" alt="Python" />
                    <p>Python</p>
                  </div>
                  <div>
                    <img src="/images/logos/html.svg" alt="HTML" />
                  </div>
                  <div>
                    <img src="/images/logos/css.svg" alt="CSS" />
                  </div>
                </div>
                <a href="/professional/aldras.html">
                  <h5>Aldras Automation</h5>
                </a>
                <p>Desktop automation application</p>
                <div class="project_tile_more">
                  <a href="/professional/aldras.html">Read more →</a>
                </div>
                <div class="project_tile_end_logo">
                  <a
                    href="https://github.com/noahbaculi/aldras-app"
                    target="_blank"
                  >
                    <img src="/images/logos/github.svg" alt="GitHub" />
                  </a>
                </div>
              </div>
            </div>
            <div class="project_tile">
              <a href="https://salesforcegalaxy.com/" target="_blank">
                <img
                  srcset="
                    /images/projects/other/salesforce_galaxy-400_w.webp   400w,
                    /images/projects/other/salesforce_galaxy-800_w.webp   800w,
                    /images/projects/other/salesforce_galaxy-1600_w.webp 1600w,
                    /images/projects/other/salesforce_galaxy-1700_w.webp 1700w
                  "
                  sizes="100vw"
                  loading="lazy"
                  decoding="async"
                  src="/images/projects/other/salesforce_galaxy-1700_w.webp"
                  alt="Salesforce Galaxy"
                />
              </a>
              <div style="padding-bottom: 0">
                <div class="project_tile_tech_used">
                  <div>
                    <img src="/images/logos/javascript.svg" alt="Javascript" />
                    <p>Javascript</p>
                  </div>
                </div>
                <a href="https://salesforcegalaxy.com/" target="_blank">
                  <h5>Salesforce Galaxy</h5>
                </a>
                <p>3D web app for learning Salesforce</p>
                <div class="project_tile_more">
                  <a
                    href="https://salesforcegalaxy.com/"
                    target="_blank"
                    style="background-color: #a21caf"
                    >Explore 🌌</a
                  >
                </div>
              </div>
              <div class="project_tile_end_logo">
                <a
                  href="https://github.com/noahbaculi/salesforcegalaxy"
                  target="_blank"
                >
                  <img src="/images/logos/github.svg" alt="GitHub" />
                </a>
              </div>
            </div>
          </div>
        </div>
        <div class="row row--1fr-1fr">
          <a href="#top" style="margin-left: 90vw">
            <img
              srcset="
                /images/icons/icon_scroll_up-25_w.webp 25w,
                /images/icons/icon_scroll_up-50_w.webp 50w
              "
              sizes="1.5em"
              loading="lazy"
              decoding="async"
              src="/images/icons/icon_scroll_up.png"
              class="scroll_icon"
              alt="Scroll
							Up"
              style="position: inherit"
            />
          </a>
        </div>
      </div>

      <footer id="footer"></footer>
    </div>

    <script src="/assets/js/jquery.min.js"></script>
    <script src="/assets/js/browser.min.js"></script>
    <script src="/assets/js/breakpoints.min.js"></script>
    <script src="/assets/js/util.js"></script>
    <script src="/assets/js/main.js"></script>
  </body>
</html>
